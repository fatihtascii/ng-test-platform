name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend testleri
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ng
          POSTGRES_PASSWORD: ng
          POSTGRES_DB: ng_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ng" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pytest (geçici SQLite)
        run: python -m pytest
      - name: Migration'lar PostgreSQL üzerinde
        env:
          DATABASE_URL: postgresql://ng:ng@localhost:5432/ng_ci
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
