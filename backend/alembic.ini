# Alembic ayarları. Veritabanı adresi .env'deki DATABASE_URL'den okunur (alembic/env.py).
#
# Sık kullanılan komutlar (backend klasöründen):
#   alembic upgrade head                              # bekleyen migration'ları uygula
#   alembic revision --autogenerate -m "aciklama"     # model değişikliğinden migration üret
#   alembic current / alembic history
#
# Backend açılışta `upgrade head`'i otomatik çalıştırır (app/db/migrate.py).

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
